table_name: iteration_snapshot
main_dttm_col: week
description: Snapshot measures at the end of each iteration (last value per iteration). Built on current_measurement.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: public
sql: "-- Snapshot measures at the end of every iteration: per repo and iteration\n-- (the minor of the\
  \ repo's version), every value at the iteration's last\n-- measured commit. Iterations are per repo,\
  \ so compare them within a repo.\nWITH snapshot AS (\n    SELECT * FROM current_measurement WHERE kind\
  \ = 'snapshot'\n),\niteration_end AS (\n    SELECT DISTINCT ON (repo, iteration) repo, iteration, sha\n\
  \    FROM snapshot\n    WHERE iteration IS NOT NULL\n    ORDER BY repo, iteration, committed_at DESC,\
  \ sha DESC\n)\nSELECT s.week, s.repo, s.sha, s.committed_at, s.iteration, s.measure, s.unit, s.area,\
  \ s.facet,\n       s.value\nFROM iteration_end e\nJOIN snapshot s ON s.repo = e.repo AND s.sha = e.sha\n"
params: null
