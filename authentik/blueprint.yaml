# code-vitals' Authentik objects (card #499), applied by
# woodpecker-plugin-authentik-blueprint in the deploy pipelines, as bored does:
# dev deployments (any branch) apply blueprint-dev.yaml only; prod deployments
# (main only) apply blueprint.yaml, which carries both environments. Keep the
# dev entries of the two files identical.
version: 1
metadata:
  name: code-vitals OIDC
  labels:
    blueprints.goauthentik.io/description: "code-vitals Superset OAuth2 providers (dev + prod), groups and application bindings"

entries:
  # ── code-vitals (dev): Superset at https://code-vitals-dev.desync.link ──────────────────
  # Membership of these groups is managed by hand in Authentik. Superset maps
  # `code-vitals-dev-users` to Alpha and `code-vitals-dev-admins` to Admin (superset_config.py);
  # the policy bindings below refuse anyone in neither before Superset sees them.
  - model: authentik_core.group
    state: present
    identifiers:
      name: code-vitals-dev-users
    attrs:
      name: code-vitals-dev-users

  - model: authentik_core.group
    state: present
    identifiers:
      name: code-vitals-dev-admins
    attrs:
      name: code-vitals-dev-admins

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: code-vitals-dev-superset
    attrs:
      name: code-vitals-dev-superset
      client_id: code-vitals-dev
      client_secret: ${AUTHENTIK_CODE_VITALS_DEV_CLIENT_SECRET}
      client_type: confidential
      # Authentik 2026.x defaults grant_types to an empty list, which refuses
      # every authorize request as "otherwise malformed". Superset only uses
      # the authorization code grant (no refresh tokens).
      grant_types:
        - authorization_code
      access_token_validity: minutes=15
      redirect_uris:
        - url: "https://code-vitals-dev.desync.link/oauth-authorized/authentik"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: code-vitals-dev
    attrs:
      name: code-vitals (dev)
      slug: code-vitals-dev
      meta_launch_url: "https://code-vitals-dev.desync.link/"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, code-vitals-dev-superset]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, code-vitals-dev]]
      group: !Find [authentik_core.group, [name, code-vitals-dev-users]]
      order: 0
    attrs:
      target: !Find [authentik_core.application, [slug, code-vitals-dev]]
      group: !Find [authentik_core.group, [name, code-vitals-dev-users]]
      order: 0
      enabled: true
      negate: false
      timeout: 30

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, code-vitals-dev]]
      group: !Find [authentik_core.group, [name, code-vitals-dev-admins]]
      order: 1
    attrs:
      target: !Find [authentik_core.application, [slug, code-vitals-dev]]
      group: !Find [authentik_core.group, [name, code-vitals-dev-admins]]
      order: 1
      enabled: true
      negate: false
      timeout: 30

  # ── code-vitals: Superset at https://code-vitals.desync.link ──────────────────
  # Membership of these groups is managed by hand in Authentik. Superset maps
  # `code-vitals-users` to Alpha and `code-vitals-admins` to Admin (superset_config.py);
  # the policy bindings below refuse anyone in neither before Superset sees them.
  - model: authentik_core.group
    state: present
    identifiers:
      name: code-vitals-users
    attrs:
      name: code-vitals-users

  - model: authentik_core.group
    state: present
    identifiers:
      name: code-vitals-admins
    attrs:
      name: code-vitals-admins

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: code-vitals-superset
    attrs:
      name: code-vitals-superset
      client_id: code-vitals
      client_secret: ${AUTHENTIK_CODE_VITALS_PROD_CLIENT_SECRET}
      client_type: confidential
      # Authentik 2026.x defaults grant_types to an empty list, which refuses
      # every authorize request as "otherwise malformed". Superset only uses
      # the authorization code grant (no refresh tokens).
      grant_types:
        - authorization_code
      access_token_validity: minutes=15
      redirect_uris:
        - url: "https://code-vitals.desync.link/oauth-authorized/authentik"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: code-vitals
    attrs:
      name: code-vitals
      slug: code-vitals
      meta_launch_url: "https://code-vitals.desync.link/"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, code-vitals-superset]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, code-vitals]]
      group: !Find [authentik_core.group, [name, code-vitals-users]]
      order: 0
    attrs:
      target: !Find [authentik_core.application, [slug, code-vitals]]
      group: !Find [authentik_core.group, [name, code-vitals-users]]
      order: 0
      enabled: true
      negate: false
      timeout: 30

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, code-vitals]]
      group: !Find [authentik_core.group, [name, code-vitals-admins]]
      order: 1
    attrs:
      target: !Find [authentik_core.application, [slug, code-vitals]]
      group: !Find [authentik_core.group, [name, code-vitals-admins]]
      order: 1
      enabled: true
      negate: false
      timeout: 30
