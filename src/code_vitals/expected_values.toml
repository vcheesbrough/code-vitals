# Expected measure values at fixed trunk commits of each measured repo.
#
# Checked after every deployment's collect (`code-vitals check-repo`,
# src/code_vitals/checks.py). A commit never changes, so neither may its
# values: a change that alters them bumps the measure's version (or the repo's
# area ruleset), and updates this table in the same PR, so every change in
# numbers is reviewed. On a mismatch, check-repo prints the recorded entries in
# this format, ready to review and paste.
#
# [<repo>]                         ruleset = the area ruleset version written for
# [<repo>.commits.<sha>.<measure>] version = the measure version written for,
#                                  then one value per row: "<area>/<facet>",
#                                  "-" for no area, no "/<facet>" when unsplit.
# Every registered measure is listed at every commit, even with no values.

[v-note]
ruleset = 1

