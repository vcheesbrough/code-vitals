table_name: commit_snapshot
main_dttm_col: committed_at
description: 'Snapshot measures at every trunk commit: one moment (committed_at) per commit time across
  all repos, with every repo''s values at its last measured commit at or before it, carried forward. A
  repo''s series changes only at its own commits and totals across repos never dip. Plot it per commit
  with NO time grain: a grain sums several commits'' states into one bucket, which is wrong for snapshots.
  Built on current_measurement.'
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: public
sql: |
  -- Snapshot measures at every trunk commit (card #549). The moments are the
  -- distinct commit times across all repos. At each moment every repo is at its
  -- last measured commit at or before it, so its values carry forward until its
  -- next commit and totals across repos never dip when another repo commits.
  -- committed_at is the moment, sha and sha_committed_at the commit whose
  -- state the row is. Linear in moments x repos: each repo's latest commit is
  -- carried by a running count of its commits, not a join on every earlier one.
  -- `state` is materialized so the final join is planned on its real size
  -- (inlined, the planner misjudges it and the query takes ~7x longer).
  WITH snapshot AS (
      SELECT repo, sha, committed_at, iteration, measure, unit, area, facet, value
      FROM current_measurement
      WHERE kind = 'snapshot'
  ),
  commits AS (
      SELECT DISTINCT ON (repo, committed_at) repo, committed_at, sha
      FROM snapshot
      ORDER BY repo, committed_at, sha DESC
  ),
  grid AS (
      SELECT m.committed_at, r.repo, c.sha,
             count(c.sha) OVER (PARTITION BY r.repo ORDER BY m.committed_at) AS run
      FROM (SELECT DISTINCT committed_at FROM commits) m
      CROSS JOIN (SELECT DISTINCT repo FROM commits) r
      LEFT JOIN commits c ON c.repo = r.repo AND c.committed_at = m.committed_at
  ),
  state AS MATERIALIZED (
      SELECT committed_at, repo,
             first_value(sha) OVER (PARTITION BY repo, run ORDER BY committed_at) AS sha
      FROM grid
      WHERE run > 0
  )
  SELECT e.committed_at, s.repo, s.sha, s.committed_at AS sha_committed_at, s.iteration, s.measure,
         s.unit, s.area, s.facet, s.value
  FROM state e
  JOIN snapshot s ON s.repo = e.repo AND s.sha = e.sha
