table_name: hotspots
main_dttm_col: committed_at
description: Per-function complexity (lizard) at every commit, from current_function_complexity.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: public
sql: "-- Per-function complexity at every commit, with the week and a readable\n-- commit label for the\
  \ dashboard's Commit filter.\nSELECT\n    f.repo,\n    f.sha,\n    f.committed_at,\n    (date_trunc('week',\
  \ f.committed_at))::date AS week,\n    f.iteration,\n    f.area,\n    f.file,\n    f.function,\n   \
  \ f.start_line,\n    f.ccn,\n    f.nloc,\n    f.params,\n    f.repo || ' · ' || to_char(f.committed_at,\
  \ 'YYYY-MM-DD HH24:MI') || ' · ' || left(f.sha, 8)\n        || coalesce(' · iteration ' || f.iteration,\
  \ '') AS commit_label\nFROM current_function_complexity f\n"
