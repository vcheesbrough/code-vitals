# Deploy-dev: a manual Woodpecker deployment targeting `dev`, from ANY branch,
# so a branch is proven in dev before it merges and a bug found there is fixed
# on the branch. It promotes the image the push pipeline already built, tested
# and published for this commit and never rebuilds (bored card #254).
#
#   (find-commit-tag → verify-image ∥ apply-authentik-blueprint) → deploy
#     → (smoke ∥ collect-<repo> ×3 → check) → tag-release
#
# deploy-prod.yml is the same flow for prod, which only `main` may deploy;
# tests/test_pipelines.py pins both gates. The steps are kept identical apart
# from the environment, so diff the two files when changing either.
when:
  - event: deployment
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'

steps:
  find-commit-tag:
    # The semver git tag already on this commit, if it was deployed before
    # (scripts/find-commit-tag.sh); verify-image then redeploys exactly that
    # build. Read-only.
    depends_on: []
    image: alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - ./scripts/find-commit-tag.sh

  apply-authentik-blueprint:
    # Superset's OAuth2 provider, application, groups and bindings (card #499).
    # Dev deployments come from any branch, so they apply the dev-only
    # blueprint with only the dev secret; the full dev+prod blueprint is applied
    # only by prod deployments. This guards against accidents, not a
    # deliberate change (AGENTS.md § Deviations register), as in bored.
    depends_on: []
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint-dev.yaml
      instance_name: code-vitals
      timeout_seconds: 900
      vars:
        AUTHENTIK_CODE_VITALS_DEV_CLIENT_SECRET:
          from_secret: code_vitals_dev_oidc_client_secret

  verify-image:
    # resolve-deploy-tag.sh picks the build: the commit's existing tag, else its
    # latest green build (:commit-<sha>). publish-image only pushes after the
    # in-build tests pass, so the image existing in the registry IS the tested
    # signal. Pull it, re-assert its labels (the revision label catches an
    # image of another commit), and record its digest for the deploy: from
    # here on the image is referenced by digest, never by a tag.
    depends_on:
      - find-commit-tag
    image: &docker-image docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment: &registry-creds
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - &docker-login echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - ./scripts/resolve-deploy-tag.sh
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/code-vitals-collector:$$RELEASE_TAG
        if ! docker pull "$$IMAGE"; then
          echo "ERROR: $$IMAGE not found in registry." >&2
          echo "resolve-deploy-tag.sh chose $$RELEASE_TAG (see its output above). If that is this commit's existing git tag, the build it names has since left the registry:" >&2
          echo "restore the image, or delete the git tag $$RELEASE_TAG so the deploy takes the commit's latest green build." >&2
          exit 1
        fi
        ./scripts/check-image-metadata.sh "$$IMAGE" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        docker image inspect -f '{{ index .RepoDigests 0 }}' "$$IMAGE" > .deploy-image
        echo "deploying $$(cat .deploy-image)"
        # The build's Superset image, published under the same version.
        SUPERSET=registry.desync.link/code-vitals-superset:$$RELEASE_TAG
        docker pull "$$SUPERSET"
        ./scripts/check-image-metadata.sh "$$SUPERSET" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        docker image inspect -f '{{ index .RepoDigests 0 }}' "$$SUPERSET" > .deploy-superset-image
        echo "deploying $$(cat .deploy-superset-image)"

  deploy:
    # Postgres up; dev's database recreated from a fresh dump of prod; then the
    # deployed image's `migrate` (scripts/deploy-stack.sh). Secrets come from
    # the broker's per-repo layer with from_secret — see AGENTS.md § Deviations
    # register for why this is not bored's `sovereign-config render`.
    depends_on:
      - verify-image
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    environment:
      <<: *registry-creds
      POSTGRES_PASSWORD:
        from_secret: code_vitals_dev_postgres_password
      CODE_VITALS_WRITER_PASSWORD: &writer-password
        from_secret: code_vitals_dev_writer_password
      CODE_VITALS_READER_PASSWORD: &reader-password
        from_secret: code_vitals_dev_reader_password
      SUPERSET_SECRET_KEY:
        from_secret: code_vitals_dev_superset_secret_key
      SUPERSET_DB_PASSWORD:
        from_secret: code_vitals_dev_superset_db_password
      AUTHENTIK_CLIENT_SECRET:
        from_secret: code_vitals_dev_oidc_client_secret
    commands:
      - *docker-login
      - ./scripts/deploy-stack.sh dev "$$(cat .deploy-image)" "$$(cat .deploy-superset-image)"

  smoke:
    # Superset answers, its sign-in redirects to this environment's Authentik
    # client, and its datasource role reads views only
    # (scripts/smoke-superset.sh). A failure fails the deployment before
    # tag-release, so the commit is not tagged as deployed.
    depends_on:
      - deploy
    image: *docker-image
    volumes: *docker-socket
    environment:
      CODE_VITALS_READER_PASSWORD: *reader-password
    commands:
      - apk add --no-cache curl
      - ./scripts/smoke-superset.sh dev

  collect-v-note:
    # The deployed image, by digest, catches each measured repo up with
    # trigger=backfill and checks it (scripts/run-collector.sh, card #497): a
    # bumped measure version or area ruleset is recomputed over the whole
    # history here — in dev from the branch, in prod on release — and the
    # values at the fixed commits of src/code_vitals/expected_values.toml must
    # match. One step per repo, in parallel.
    depends_on:
      - deploy
    image: *docker-image
    volumes: *docker-socket
    environment: &collect-env
      <<: *registry-creds
      CODE_VITALS_WRITER_PASSWORD: *writer-password
    commands:
      - *docker-login
      - ./scripts/run-collector.sh dev "$$(cat .deploy-image)" repo v-note

  collect-bored:
    depends_on:
      - deploy
    image: *docker-image
    volumes: *docker-socket
    environment: *collect-env
    commands:
      - *docker-login
      - ./scripts/run-collector.sh dev "$$(cat .deploy-image)" repo bored

  collect-sovereign-config:
    depends_on:
      - deploy
    image: *docker-image
    volumes: *docker-socket
    environment: *collect-env
    commands:
      - *docker-login
      - ./scripts/run-collector.sh dev "$$(cat .deploy-image)" repo sovereign-config

  check:
    # Once every repo is collected: every version this build registers is
    # complete, so the views read it, and every repo's last run succeeded. A
    # failure fails the deployment before tag-release.
    depends_on:
      - collect-v-note
      - collect-bored
      - collect-sovereign-config
    image: *docker-image
    volumes: *docker-socket
    environment: *collect-env
    commands:
      - *docker-login
      - ./scripts/run-collector.sh dev "$$(cat .deploy-image)" status

  tag-release:
    # After a successful deploy and its checks, push the git tag matching .release-tag, so a
    # tag means "this version was deployed". push-tag is idempotent: a commit
    # already carrying this tag (a redeploy, or dev then prod) exits 0, and a
    # commit never gets a second tag. push-tag never reads the manifest, but
    # the plugin requires major_minor_source and knows only go and cargo;
    # `cargo` is a placeholder until shared release tooling replaces this
    # (card #503).
    depends_on:
      - smoke
      - check
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.1@sha256:cf74d9706cb42b6d27c8d185789cd814ed061c8c88e06452d33ce3aed0bf9a22
    settings:
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token
