metrics:
- metric_name: lines_added
  verbose_name: Lines added
  metric_type: null
  expression: SUM(value) FILTER (WHERE measure = 'lines_added')
  description: 'Lines added by the commits (flow: summed per period).'
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: lines_deleted_below_zero
  verbose_name: Lines deleted
  metric_type: null
  expression: -SUM(value) FILTER (WHERE measure = 'lines_deleted')
  description: 'Lines deleted by the commits, negated so a chart draws them below zero (flow: summed per
    period).'
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: churn
  verbose_name: Churn (lines added + deleted)
  metric_type: null
  expression: SUM(value) FILTER (WHERE measure IN ('lines_added', 'lines_deleted'))
  description: 'Lines added plus lines deleted (flow: summed per period).'
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
- metric_name: files_changed
  verbose_name: Files changed
  metric_type: null
  expression: SUM(value) FILTER (WHERE measure = 'files_changed')
  description: 'Files the commits changed (flow: summed per period).'
  d3format: ',d'
  currency: null
  extra: null
  warning_text: null
