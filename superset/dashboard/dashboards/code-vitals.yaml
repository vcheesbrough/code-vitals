  MARKDOWN-intro:
    children: []
    id: MARKDOWN-intro
    meta:
      code: '**Snapshot** measures (size, complexity, operations, scenarios) show each repo''s state at
        the end of each week: its last measured commit on or before that week, carried forward through
        quiet weeks. **Flow** measures (churn) sum the week''s or the iteration''s commits. Ratios are
        computed here, never stored. Lines are lizard''s NLOC. Iteration numbers are per repo.


        The **Commit** filter picks the moment the Hotspots table shows; the Week range does not apply
        to it or to Freshness, and Area not to the test share (a ratio across areas). This dashboard is code: edit `superset/dashboard/` in the code-vitals repo
        — changes made here are replaced on the next deploy.'
      height: 22
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-intro
    type: MARKDOWN
